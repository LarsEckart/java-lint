required.constructor.field.null.check=Null check on constructor field ''{0}'' lacks an explicit nullable contract; mark it @Nullable or remove the null recovery.
avoid.private.member=Prefer package-private visibility over private for testable members.
avoid.final.variable=Do not use final on fields, local variables, or parameters; static final constants are allowed.
lambda.multiple.statements=Extract a multi-statement lambda into a named method.
prefer.stream.to.list=Use Stream.toList() instead of collect(Collectors.toList()).
avoid.optional.parameter=Do not use Optional as a parameter type.
prefer.method.reference=Replace this equivalent lambda with a method reference.
logger.declaration=Logger fields must be named LOGGER and declared static final.
catch.must.log.or.throw=Call a log method or throw an exception from this catch block.
javadoc.use.markdown=Use Markdown JavaDoc (///) instead of a traditional /** */ block.
